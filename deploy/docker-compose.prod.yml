# BlissNova production stack for one server. See docs/DEPLOYMENT.md.
#
#   cd /opt/blissnova/app
#   cp deploy/prod.env.example deploy/prod.env   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/prod.env up -d --build
#
# Caddy terminates HTTPS and gets the certificate from Let's Encrypt by itself.
# Only ports 80 and 443 are published; the database, Redis, API and web stay
# on the private Docker network.
name: blissnova

x-app: &app
  env_file: [prod.env]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blissnova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: blissnova
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blissnova -d blissnova"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies database migrations, then exits. Runs on every `up`.
  migrate:
    <<: *app
    build: { context: .., target: api }
    image: blissnova-api
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"

  api:
    <<: *app
    image: blissnova-api
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    build: { context: .., target: worker }
    image: blissnova-worker
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The web app needs no secrets; it only proxies to the API.
  web:
    build: { context: .., target: web, args: { API_INTERNAL_URL: "http://api:4000", NEXT_PUBLIC_SITE_URL: "https://${SITE_DOMAIN}" } }
    image: blissnova-web
    restart: unless-stopped
    depends_on: [api]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in prod.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in prod.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
